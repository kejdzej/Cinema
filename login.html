<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zaloguj się</title>
  <style>
    body {
      background-color: #0e0e1b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    form {
      display: inline-block;
      text-align: left;
      background-color: #1c1c2c;
      padding: 30px;
      border-radius: 10px;
    }

    input {
      display: block;
      width: 250px;
      margin-bottom: 15px;
      padding: 8px;
      border: none;
      border-radius: 4px;
    }

    button {
      padding: 10px 20px;
      background-color: gold;
      color: black;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Zaloguj się</h2>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Login" required />
    <input type="password" id="password" placeholder="Hasło" required />
    <button type="submit">Zaloguj</button>
  </form>

  <script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      // 👇 Тут можна додати перевірку логіна/пароля або просто логін
      if (username && password) {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("username", username);

        alert("Zalogowano pomyślnie!");
        window.location.href = "index.html"; // повертає на головну
      } else {
        alert("Wprowadź login i hasło.");
      }
    });
  </script>
</body>
</html>
